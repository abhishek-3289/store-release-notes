name: Store Release Notes
description: Build Google Play and App Store "What's new" text from merged pull requests
author: Abhishek Bansal

branding:
  icon: file-text
  color: green

inputs:
  milestone:
    description: Milestone title or number whose merged pull requests are used; use either this or from-tag
    required: false
    default: ''
  from-tag:
    description: Tag or ref to compare from; pull requests merged between from-tag and to-ref are used
    required: false
    default: ''
  to-ref:
    description: Ref to compare to when from-tag is used; defaults to the workflow commit (GITHUB_SHA)
    required: false
    default: ''
  max-prs:
    description: Maximum number of merged pull requests to collect
    required: false
    default: '200'
  include-labels:
    description: Comma-separated labels; when set, only pull requests with at least one of them are used
    required: false
    default: ''
  exclude-labels:
    description: Comma-separated labels; pull requests with any of them are skipped
    required: false
    default: skip-release-notes,internal,dependencies
  sections:
    description: Comma-separated label:Title pairs in priority order, e.g. feature:New,bug:Fixes
    required: false
    default: ''
  other-section-title:
    description: Title of the section for pull requests without a mapped label
    required: false
    default: Other changes
  include-unlabeled:
    description: Set to false to drop pull requests without a mapped label
    required: false
    default: 'true'
  clean-titles:
    description: Strip ticket prefixes (ABC-123:, [ABC-123]) and conventional-commit prefixes (feat:, fix(scope):)
    required: false
    default: 'true'
  header:
    description: Optional first line; {version} is replaced with the version input
    required: false
    default: ''
  version:
    description: Value for the {version} placeholder in header
    required: false
    default: ''
  locales:
    description: Comma-separated locales to write Play files for; every locale gets the same text
    required: false
    default: en-US
  play-dir:
    description: Directory for <play-dir>/whatsnew-<locale> files (r0adkll/upload-google-play whatsNewDirectory)
    required: false
    default: ''
  play-gpp-dir:
    description: Directory for <play-gpp-dir>/<locale>/default.txt files (Gradle Play Publisher)
    required: false
    default: ''
  appstore-file:
    description: File path for the App Store text (fastlane release_notes.txt)
    required: false
    default: ''
  github-token:
    description: Token used to read milestones, issues, commits and pull requests
    required: false
    default: ${{ github.token }}
  repository:
    description: Repository in owner/name form; defaults to the current repository
    required: false
    default: ''

outputs:
  play-notes:
    description: Google Play text, at most 500 characters
  appstore-notes:
    description: App Store text, at most 4000 characters
  markdown:
    description: Full markdown list with pull request links, never truncated
  pr-count:
    description: Number of pull requests included before store truncation
  truncated:
    description: true when the Play or App Store text was shortened, otherwise false

runs:
  using: node24
  main: src/index.js
