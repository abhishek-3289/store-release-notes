name: Release notes for a tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: previous
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null \
            || git rev-list --max-parents=0 HEAD | tail -n 1)
          echo "Notes from $PREVIOUS to $GITHUB_REF_NAME"
          echo "ref=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        uses: appshipkit/store-release-notes@v1
        with:
          from-tag: ${{ steps.previous.outputs.ref }}
          to-ref: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          header: "What's new in {version}"
          sections: 'feature:New,bug:Fixes'
          appstore-file: fastlane/metadata/en-US/release_notes.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.markdown }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-body.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-body.md"

      - name: Keep App Store notes for fastlane
        uses: actions/upload-artifact@v7
        with:
          name: appstore-release-notes
          path: fastlane/metadata/en-US/release_notes.txt
